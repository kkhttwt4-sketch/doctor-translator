    <script>
      (function() {
        function ignoreWs(e) {
          try {
            var msg = (e && (e.message || (e.reason && (e.reason.message || e.reason)))) || '';
            if (typeof msg === 'string' && (msg.indexOf('WebSocket') !== -1 || msg.indexOf('vite:ws') !== -1 || msg.indexOf('closed without opened') !== -1)) {
              if (e.preventDefault) e.preventDefault();
              if (e.stopPropagation) e.stopPropagation();
              if (e.stopImmediatePropagation) e.stopImmediatePropagation();
              return true;
            }
          } catch (_) {}
        }
        window.addEventListener('unhandledrejection', ignoreWs, true);
        window.addEventListener('error', ignoreWs, true);
      })();
    </script>
